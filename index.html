<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Menu MBG</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    border-radius: 20px;
    padding: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,.1);
}

h1 {
    text-align: center;
}

.tanggal {
    text-align: center;
    color: #666;
}

.menu {
    margin-top: 20px;
}

.menu-item {
    padding: 12px;
    border-bottom: 1px solid #eee;
}

.gizi {
    margin-top: 20px;
    padding: 15px;
    background: #f8f8f8;
    border-radius: 15px;
}

.gizi div {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
}
</style>
</head>

<body>

<div class="container">

    <h1>🍽️ MENU MBG</h1>

    <p class="tanggal">
        Senin, 7 September 2026
    </p>

    <div class="menu">

        <div class="menu-item">🍚 Nasi</div>
        <div class="menu-item">🍗 Ayam</div>
        <div class="menu-item">🥬 Sayur</div>
        <div class="menu-item">🍌 Pisang</div>
        <div class="menu-item">🥛 Susu</div>

    </div>

    <div class="gizi">

        <h3>Informasi Nilai Gizi</h3>

        <div>
            <span>Energi</span>
            <b>650 kkal</b>
        </div>

        <div>
            <span>Protein</span>
            <b>25 g</b>
        </div>

        <div>
            <span>Lemak</span>
            <b>20 g</b>
        </div>

        <div>
            <span>Karbohidrat</span>
            <b>85 g</b>
        </div>

        <div>
            <span>Serat</span>
            <b>8 g</b>
        </div>

    </div>

</div>

</body>
</html>
